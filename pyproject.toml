[project]
name = "research-agents"
version = "0.1.0"
description = "Research agents powered by OpenAI Agents SDK for analyzing scientific papers"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai-agents>=0.17.4",
    "pydantic>=2.12.5",
    "pypdf>=4.0.0",
    "python-dotenv>=1.2.2",
]

[dependency-groups]
dev = [
    "fpdf2>=2.8.7",
    "pytest>=9.0.3",
    "ruff>=0.15",
    "ty>=0.0.39",
]

# Match the existing source line widths so adopting the formatter does not
# force a wholesale reflow.  Most files sit around 90-100 chars; 100 is the
# tightest cap that keeps the current code untouched on `ruff format`.
[tool.ruff]
line-length = 100
target-version = "py312"
